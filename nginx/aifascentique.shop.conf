# AIFA SCENTIQUE — aifascentique.shop (frontend + backend on one domain)
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled
#
# Routing:
#   /                              → Next.js (store + admin BFF) :3001
#   /health                        → Go API health check :8080
#   /api/store/payments/webhook    → Go API (Razorpay webhooks) :8080
# All other /api/* traffic is handled by Next.js BFF, which proxies to Go internally.
#
# Client IP: no CDN / trusted proxy in front of this nginx. Rate limits and
# X-Real-IP use $remote_addr / $binary_remote_addr as the real client address.
# If a CDN is added later, configure real_ip_module before relying on these zones.

# Per-IP cap on customer OTP endpoints (SMS cost + code guessing). The Go API
# also limits per phone; it only sees the Next.js server's IP, so per-IP lives here.
limit_req_zone $binary_remote_addr zone=aifa_otp:10m rate=6r/m;

# Admin login + password change (and any other auth not covered by aifa_otp).
limit_req_zone $binary_remote_addr zone=aifa_auth:10m rate=10r/m;

# Order + payment creation (checkout abuse / card testing).
limit_req_zone $binary_remote_addr zone=aifa_order:10m rate=20r/m;

# General /api/* ceiling.
limit_req_zone $binary_remote_addr zone=aifa_api:10m rate=10r/s;

upstream aifa_web {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream aifa_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name aifascentique.shop www.aifascentique.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aifascentique.shop$request_uri;
    }
}

# HTTPS www → apex. Cert path is the Let's Encrypt live name for
# aifascentique.shop (issued with -d aifascentique.shop -d www.aifascentique.shop).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aifascentique.shop;

    ssl_certificate     /etc/letsencrypt/live/aifascentique.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aifascentique.shop/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://aifascentique.shop$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aifascentique.shop;

    ssl_certificate     /etc/letsencrypt/live/aifascentique.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aifascentique.shop/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend image upload max is 10 MiB (+ multipart overhead); 20M leaves headroom.
    client_max_body_size 20M;

    # No rate limit — load balancer / uptime probes.
    location = /health {
        proxy_pass http://aifa_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # No rate limit — Razorpay retries must never get 429.
    location = /api/store/payments/webhook {
        proxy_pass http://aifa_api/api/store/payments/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Customer OTP send / verify / MSG91 login (Next BFF → Go).
    location = /api/customer/auth/request-otp {
        limit_req zone=aifa_otp burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/customer/auth/verify-otp {
        limit_req zone=aifa_otp burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/customer/auth/msg91-verify {
        limit_req zone=aifa_otp burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin login (Next BFF).
    location = /api/admin/auth/login {
        limit_req zone=aifa_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Password change — Next exposes /account/...; Go also has /auth/change-password.
    location = /api/admin/account/change-password {
        limit_req zone=aifa_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/admin/auth/change-password {
        limit_req zone=aifa_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Checkout: create order + start payment (Next BFF).
    location = /api/store/orders {
        limit_req zone=aifa_order burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/store/payments/create {
        limit_req zone=aifa_order burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other /api/* (Next BFF). More specific locations above win first.
    location /api/ {
        limit_req zone=aifa_api burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 20M;
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://aifa_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
